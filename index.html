<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namaste Mall — Namaste Pattaya Luxury Collection</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth transitions for zoom and swap */
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        /* Custom scrollbar for clothing rail */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#F4F4F4] text-neutral-900 font-sans select-none overflow-hidden h-screen flex flex-col justify-between">

    <!-- Top Brand Bar (Namaste Pattaya / Namaste Mall) -->
    <header class="flex justify-between items-center px-8 py-6 border-b border-neutral-300 z-20 bg-[#F4F4F4]/90 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <h1 class="text-sm tracking-[0.2em] uppercase font-semibold">NAMASTE PATTAYA</h1>
            <span class="text-neutral-300">/</span>
            <span class="text-xs tracking-[0.15em] uppercase text-neutral-600 font-medium">MALL ATELIER</span>
        </div>
        <span class="text-xs text-neutral-500 tracking-widest">COLLECTION 2026</span>
    </header>

    <!-- Main Dynamic Stage -->
    <main id="app-stage" class="flex-1 flex items-center justify-center relative w-full overflow-hidden">
        
        <!-- VIEW 1: THE CLOSET RAIL (Default) -->
        <div id="rail-view" class="relative w-full h-full flex flex-col justify-center items-center fade-in">
            <!-- Metal Rod Graphic -->
            <div class="absolute top-[30%] w-[85%] max-w-5xl h-[3px] bg-neutral-300 shadow-inner rounded-full"></div>

            <!-- Floating Hanging Items Container (No background boxes) -->
            <div class="flex gap-20 z-10 overflow-x-auto px-12 items-start pt-12 max-w-full no-scrollbar">
                
                <!-- Item 1 -->
                <div onclick="openItem(1)" class="cursor-pointer flex flex-col items-center group flex-shrink-0 transition-transform duration-500 hover:-translate-y-3">
                    <div class="w-40 h-80 flex items-center justify-center">
                        <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?q=80&w=600&auto=format&fit=crop" alt="Tank Top" class="max-h-full max-w-full object-contain drop-shadow-[0_20px_25px_rgba(0,0,0,0.15)] pointer-events-none group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <span class="mt-8 text-[10px] tracking-[0.25em] text-neutral-400 group-hover:text-black uppercase transition-colors">DISTRESSED TANK TOP</span>
                </div>

                <!-- Item 2 -->
                <div onclick="openItem(2)" class="cursor-pointer flex flex-col items-center group flex-shrink-0 transition-transform duration-500 hover:-translate-y-3">
                    <div class="w-40 h-80 flex items-center justify-center">
                        <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?q=80&w=600&auto=format&fit=crop" alt="Cashmere Hoodie" class="max-h-full max-w-full object-contain drop-shadow-[0_20px_25px_rgba(0,0,0,0.15)] pointer-events-none group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <span class="mt-8 text-[10px] tracking-[0.25em] text-neutral-400 group-hover:text-black uppercase transition-colors">CASHMERE HOODIE</span>
                </div>

                <!-- Item 3 -->
                <div onclick="openItem(3)" class="cursor-pointer flex flex-col items-center group flex-shrink-0 transition-transform duration-500 hover:-translate-y-3">
                    <div class="w-40 h-80 flex items-center justify-center">
                        <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?q=80&w=600&auto=format&fit=crop" alt="Leather Bomber" class="max-h-full max-w-full object-contain drop-shadow-[0_20px_25px_rgba(0,0,0,0.15)] pointer-events-none group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <span class="mt-8 text-[10px] tracking-[0.25em] text-neutral-400 group-hover:text-black uppercase transition-colors">LEATHER BOMBER</span>
                </div>

            </div>
        </div>

        <!-- VIEW 2: ZOOMED ITEM VIEW (Hidden by default) -->
        <div
