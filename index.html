<style>
:root{
  --red:#A3000F; --red-hot:#D21F1F; --wine:#6E0716; --deep:#2A0306; --ink:#050505; --white:#FFFFFF;
  --muted:#CFCFCF; --soft:#A8A8A8; --glass:rgba(10,10,10,.55); --line:rgba(255,255,255,.14);
  --silver:linear-gradient(180deg,#CFCFCF 0%,#E9E9E9 45%,#F5F5F5 100%);
  --photo:linear-gradient(180deg,#7A0A1E 0%,#D21F1F 55%,#2A0306 100%);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#050505}}
:root[data-theme="dark"]{--ink:#050505}
html{height:100%;background:#050505;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:#050505;color:var(--white);font-family:Manrope,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
button,input{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.serif{font-family:Italiana,Didot,"Bodoni 72",Georgia,serif;font-weight:400}
#app{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,var(--wine) 0%,var(--deep) 42%,var(--ink) 100%)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:20px 20px 110px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}
h1{margin:0;font-size:40px;line-height:1}
.sub{font-size:13.5px;color:var(--muted);line-height:1.45;margin:0}
.btn{height:54px;border-radius:27px;border:0;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-white{background:#fff;color:#050505}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-red{background:var(--red);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--glass);color:#fff;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;backdrop-filter:blur(12px)}
.icon-btn.white{background:#fff;color:#050505;border-color:#fff}
.dot-badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#FF3B3B;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px)}
.chip{height:34px;padding:0 14px;border-radius:17px;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:#fff;color:#050505;border-color:#fff}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:12px;background:#fff;color:#050505;font-size:10.5px;font-weight:800;letter-spacing:.04em}
.seg{display:grid;gap:4px;padding:4px;border-radius:24px}
.seg button{height:40px;border-radius:20px;border:0;background:transparent;color:inherit;font-size:13px;font-weight:800;transition:background .25s,color .25s}
.seg button.on{background:#fff;color:#050505}
.seg.light{background:#DADADA;color:#050505}
.seg.light button.on{background:#050505;color:#fff}
.photo{background:var(--photo);position:relative;overflow:hidden}
.sil{position:absolute;bottom:0;left:0;width:100%;fill:rgba(255,255,255,.12);pointer-events:none}
.initial{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;color:rgba(255,255,255,.22)}
.label-sm{font-size:12px;font-weight:800;color:#E6E6E6;letter-spacing:.02em;margin:6px 0 2px}
input.field{height:52px;border-radius:26px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;padding:0 18px;font-size:15px;width:100%;outline:none}
input.field::placeholder{color:#bdbdbd}
input.field.big{height:66px;border-radius:33px;font-size:21px;font-weight:700;padding:0 24px;border-width:1.5px}
/* nav */
.nav{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:64px;border-radius:32px;background:rgba(12,12,12,.78);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:20}
.nav button{width:48px;height:48px;border-radius:24px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center}
.nav button.on{background:var(--red);box-shadow:0 0 0 0 rgba(163,0,15,.6);animation:pulse 2.4s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(163,0,15,.6)}50%{box-shadow:0 0 0 8px rgba(163,0,15,0)}}
/* deck */
.deck{position:relative;height:440px;margin-top:6px}
.card{position:absolute;inset:0;border-radius:32px;touch-action:pan-y;user-select:none}
.card.back{transform:translateY(16px) scale(.94);opacity:.7}
.card .shade{position:absolute;left:0;right:0;bottom:0;height:220px;background:linear-gradient(180deg,rgba(5,5,5,0),rgba(5,5,5,.92) 75%);pointer-events:none}
.card .info{position:absolute;left:18px;right:80px;bottom:18px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.card .stamp{position:absolute;top:34px;padding:4px 14px;border:3px solid;border-radius:10px;font-size:26px;font-weight:800;letter-spacing:.08em;opacity:0;pointer-events:none}
.side-pill{position:absolute;right:12px;bottom:120px;display:flex;flex-direction:column;gap:10px;padding:8px;border-radius:28px;z-index:3}
.side-pill button{width:42px;height:42px;border-radius:21px;border:0;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}
.side-pill button.like{background:#fff;color:var(--red)}
.mini-chip{height:28px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.actions{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:22px}
.round{border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#fff;display:flex;align-items:center;justify-content:center}
/* stories */
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;flex-shrink:0;background:none;border:0;color:#fff;padding:0}
.story .ring{width:60px;height:60px;border-radius:30px;padding:3px;border:2px solid #fff}
.story .ring.seen{border-color:rgba(255,255,255,.3)}
.story .in{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;background:var(--photo)}
.story .in img,.story .in video{width:100%;height:100%;object-fit:cover}
.story span{font-size:11px;font-weight:700;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story small{font-size:10px;color:#FFB3BA;margin-top:-3px}
/* overlays */
.overlay{position:absolute;inset:0;z-index:40;background:linear-gradient(180deg,var(--wine) 0%,var(--deep) 42%,var(--ink) 100%);animation:slideUp .32s cubic-bezier(.2,.8,.2,1)}
.overlay.dark{background:#000}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.toast{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:60;padding:12px 14px;border-radius:22px;display:flex;align-items:center;gap:12px;animation:drop .4s cubic-bezier(.2,.8,.2,1);cursor:pointer}
@keyframes drop{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
.toast.hide{transition:transform .35s,opacity .35s;transform:translateY(-120%);opacity:0}
/* chat */
.msgs{position:absolute;left:0;right:0;top:150px;bottom:92px;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:78%;padding:11px 15px;font-size:15px;line-height:1.4;animation:slideUp .25s ease;white-space:pre-wrap;word-wrap:break-word}
.bubble.me{align-self:flex-end;background:var(--red);border-radius:22px 22px 6px 22px}
.bubble.av{background:#fff;color:#050505;border-radius:22px 22px 22px 6px}
.who{font-size:10.5px;font-weight:800;color:#FFB3BA;letter-spacing:.04em}
.typing{display:flex;gap:5px;padding:14px 16px;background:#fff;border-radius:22px;align-self:flex-start}
.typing i{width:7px;height:7px;border-radius:4px;background:#050505;animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.composer{position:absolute;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.composer input{flex:1;height:54px;border-radius:27px;border:0;background:#fff;color:#050505;padding:0 18px;font-size:15px;outline:none;min-width:0}
/* dial */
.dial{position:relative;width:280px;height:280px;margin:4px auto 0}
.dial .hr{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:15px;border:0;background:transparent;color:rgba(255,255,255,.55);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0}
.dial .hr.in{color:#fff}
.dial .hr.end{background:#fff;color:#050505}
.dial .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:132px;height:132px;border-radius:66px;background:rgba(10,10,10,.72);border:1px solid rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
/* grid */
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border-radius:16px;overflow:hidden;position:relative;border:0;padding:0;color:#fff;background:var(--photo)}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .meta{position:absolute;left:8px;bottom:7px;font-size:11px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.tile .play{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:17px;background:rgba(255,255,255,.92);color:#050505;display:flex;align-items:center;justify-content:center}
.tile .gif{position:absolute;top:8px;left:8px;height:20px;padding:0 7px;border-radius:6px;background:#fff;color:#050505;font-size:10px;font-weight:900;display:flex;align-items:center}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);background:none;border-left:0;border-right:0;border-top:0;color:#fff;width:100%;text-align:left}
.av{width:46px;height:46px;border-radius:23px;flex-shrink:0;position:relative;overflow:hidden;background:var(--photo);display:flex;align-items:center;justify-content:center;font-weight:800}
.silver{background:var(--silver);color:#050505}
.progress{height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.progress i{display:block;height:100%;background:#fff;width:0}
.scan{position:absolute;left:0;right:0;top:0;height:3px;background:#fff;box-shadow:0 0 16px 4px rgba(255,255,255,.8);animation:scan 2.4s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(170px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* Tingram characters (2D) */
.char2d-wrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;perspective:900px;padding-bottom:5%;pointer-events:none}
.char2d-wrap::before{content:'';position:absolute;bottom:3%;left:50%;width:62%;height:26px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(210,31,31,.55),rgba(163,0,15,.15) 55%,transparent 72%)}
.char2d-wrap::after{content:'';position:absolute;bottom:4.5%;left:50%;width:38%;height:12px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%)}
.char2d{position:relative;z-index:1;height:90%;max-width:94%;object-fit:contain;transform-origin:50% 100%;animation:c2idle 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45)) drop-shadow(0 0 22px rgba(210,31,31,.25));will-change:transform}
@keyframes c2idle{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(1.005,1.012)}}
.char2d-wrap[data-talk] .char2d{animation:c2talk .3s ease-in-out infinite}
@keyframes c2talk{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-1.2%) scale(1.008,1.018)}}
.char2d-wrap[data-talk] .talkdots{opacity:1}
.talkdots{position:absolute;z-index:2;top:6%;right:14%;padding:6px 10px;border-radius:14px;background:#fff;color:#050505;font-weight:900;letter-spacing:2px;opacity:0;transition:opacity .2s}
.char2d-wrap[data-act=jump] .char2d{animation:c2jump .8s cubic-bezier(.3,.7,.4,1) 3}
@keyframes c2jump{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.06,.92)}50%{transform:translateY(-26%) scale(.97,1.04)}85%{transform:translateY(0) scale(1.04,.95)}}
.char2d-wrap[data-act=run] .char2d{animation:c2run .32s linear 11}
@keyframes c2run{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5%) rotate(3deg)}}
.char2d-wrap[data-act=dance] .char2d{animation:c2dance .9s ease-in-out 5}
@keyframes c2dance{0%,100%{transform:rotate(-8deg) translateX(-6%)}25%{transform:translateY(-6%)}50%{transform:rotate(8deg) translateX(6%)}75%{transform:translateY(-6%)}}
.char2d-wrap[data-act=spin] .char2d{animation:c2spin 1.2s ease-in-out 1}
@keyframes c2spin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.char2d-wrap[data-act=sit] .char2d{animation:c2sit 3.4s ease 1}
@keyframes c2sit{0%,100%{transform:none}20%,80%{transform:translateY(6%) scale(1.06,.8)}}
.char2d-wrap[data-act=bow] .char2d{animation:c2bow 1.6s ease 1}
@keyframes c2bow{0%,100%{transform:none}40%,60%{transform:rotateX(28deg)}}
.char2d-wrap[data-act=clap] .char2d{animation:c2clap .3s ease 8}
@keyframes c2clap{50%{transform:scale(1.03,.97) translateY(-2%)}}
.char2d-wrap[data-act=flex] .char2d{animation:c2flex .5s ease 4}
@keyframes c2flex{50%{transform:scale(1.08)}}
.char2d-wrap[data-act=wave] .char2d{animation:c2wave .5s ease 4}
@keyframes c2wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.pick-char{position:relative;border:2px solid rgba(255,255,255,.25);border-radius:22px;background:rgba(0,0,0,.25);color:#fff;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-family:inherit}
.pick-char img{height:170px;object-fit:contain}
.pick-char.on{border-color:#fff;background:rgba(255,255,255,.12)}

/* ---------- calendar ---------- */
.calcard{position:relative;border-radius:30px;overflow:hidden;padding:14px 10px 12px;box-shadow:0 14px 40px rgba(31,38,60,.12);border:0;display:block;text-align:left}
.calcard .veil{position:absolute;inset:0;pointer-events:none}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-head .wd{text-align:center;font-size:11px;font-weight:800;opacity:.7;padding:2px 0 6px}
.cal-title{border:0;background:transparent;color:inherit;font-size:26px;font-weight:700;letter-spacing:.01em}
.cal-nav{width:38px;height:38px;border-radius:19px;border:0;display:flex;align-items:center;justify-content:center;color:inherit;background:rgba(127,127,127,.15)}
.cday{aspect-ratio:1/1.08;border-radius:12px;border:0;background:transparent;color:inherit;position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 0 0;font-weight:700;font-size:15px;background-size:cover;background-position:center;overflow:hidden;font-family:inherit}
.cday .cnum{position:relative;z-index:1}
.cday.out{opacity:.35}
.cday.today{box-shadow:inset 0 0 0 2px #A3000F}
.cday.today .cnum{color:#fff;background:#A3000F;border-radius:12px;padding:0 7px}
.cday.has-thumb{color:#fff}
.cday.has-thumb::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.1) 60%,rgba(0,0,0,.4))}
.cday .dots{position:absolute;bottom:5px;left:0;right:0;display:flex;gap:3px;justify-content:center;z-index:1}
.cday .dots i{width:6px;height:6px;border-radius:3px;background:#A3000F}
.cday .dots i.live{background:#FF2D2D;box-shadow:0 0 6px #FF2D2D;animation:pulse 1.4s infinite}
.cday .dots i.m{background:currentColor;opacity:.8}
.cal-classic{color:#050505}
.cal-classic .cday:not(.has-thumb){background:rgba(0,0,0,.035)}
.cal-glass{color:#fff}
.cal-glass .veil{background:rgba(255,255,255,.12)}
.cal-glass .cday:not(.has-thumb){background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);backdrop-filter:blur(6px)}
.cal-dark{color:#fff}
.cal-dark .veil{background:rgba(5,5,5,.55)}
.cal-dark .cday:not(.has-thumb){background:rgba(255,255,255,.07)}
.cal-neon{color:#fff}
.cal-neon .veil{background:rgba(5,5,5,.74)}
.cal-neon .cday{box-shadow:inset 0 0 0 1px rgba(255,45,60,.55)}
.cal-neon .cnum{text-shadow:0 0 8px #ff2d3c,0 0 16px #ff2d3c}
.cal-sheet-bg{position:absolute;inset:0;z-index:45;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;animation:slideUp .25s ease}
.cal-sheet{width:100%;max-height:90%;overflow-y:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));color:#050505}
.cal-sheet .chip{color:#050505;border-color:#bbb;background:#fff}
.cal-sheet .chip.on{background:#A3000F;color:#fff;border-color:#A3000F}
select.field{height:52px;border-radius:26px;padding:0 14px;font-size:15px;appearance:auto}

/* 2D character box with moving lips + captions */
.char2d{height:90%;max-width:94%}
.char2d img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.mouth{position:absolute;transform:translate(-50%,-50%) scaleY(.08);aspect-ratio:1.6/1;border-radius:45% 45% 50% 50%/40% 40% 60% 60%;background:radial-gradient(ellipse at 50% 35%,#2a0608 0%,#5c1418 55%,#b3525a 100%);box-shadow:0 0 0 1px rgba(150,60,60,.35);opacity:0;transition:opacity .12s}
.char2d-wrap[data-talk] .mouth{opacity:1;animation:lips .17s ease-in-out infinite alternate}
@keyframes lips{0%{transform:translate(-50%,-50%) scaleY(.18)}55%{transform:translate(-50%,-50%) scaleY(.75)}100%{transform:translate(-50%,-50%) scaleY(1)}}
.char2d-wrap[data-talk] .char2d{animation:c2talk .45s ease-in-out infinite}
@keyframes c2talk{0%,100%{transform:translateY(0)}50%{transform:translateY(-.6%)}}
.caption{position:absolute;z-index:3;left:6%;right:6%;bottom:2%;padding:9px 13px;border-radius:16px;background:rgba(255,255,255,.94);color:#050505;font-size:13.5px;font-weight:700;line-height:1.35;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.15);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;pointer-events:none}
.caption.on{opacity:1;transform:none}
.talkdots{display:none}

.feed-card{border-radius:26px;overflow:hidden;background:rgba(255,255,255,.7);box-shadow:0 12px 30px rgba(31,38,60,.12)}
.feed-photo{position:relative;height:230px;overflow:hidden;background-size:cover;background-position:center}
.feed-shade{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.75))}
body:not(.light) .feed-card{background:rgba(255,255,255,.06)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

async function avatarReply(person, history){
  if (sample){
    const transcript = history.slice(-12).map(m => (m.from==='me'?'Visitor':'Avatar')+': '+m.text).join('\n');
    const prompt = 'You are the AI avatar of '+person.name+', '+person.age+', on the dating app Tingram. '+
      'Profile: "'+person.bio+'". Interests: '+person.tags.join(', ')+'. Personality: '+person.vibe+'. '+
      'Today they plan '+person.plan.act.toLowerCase()+' from '+hh(person.plan.s)+' to '+hh(person.plan.e)+'. '+
      'A visitor is chatting with you before '+person.name+' has allowed a real chat. You speak for '+person.name+' as their avatar: friendly, flirty but respectful, never sexual. '+
      'Never claim to be the real person, never share contact details, addresses or exact locations, never agree to meet on their behalf — say '+person.name+' decides that. '+
      'Reply in the visitor’s language, 1–2 short sentences, no emoji spam, no quotation marks.\n\nConversation:\n'+transcript+'\n\nAvatar:';
    try {
      const r = await sample(prompt, { modelTier:'quick', cache:false });
      const t = (r && r.text || '').trim();
      if (t) return t.replace(/^Avatar:\s*/i,'');
    } catch(e){ if (e && e.code==='not_granted') sample = null; }
  }
  const n = history.filter(m=>m.from==='av').length;
  return CANNED[n % CANNED.length];
}

function notify(title, sub, kind, go){
  S.notes.unshift({id:now()+Math.random(), title, sub, ts:now(), read:false, kind:kind||'bell', go:go||null});
  S.notes = S.notes.slice(0,40);
  save();
  const t = h('div',{class:'toast glass', role:'status', onclick:()=>{ t.remove(); if(go) openGo(go); else { V.overlay='notes'; render(); } }},
    h('div',{class:'av', style:'width:40px;height:40px'}, ic(kind||'bell',18)),
    h('div',{style:'flex:1;min-width:0'}, h('div',{style:'font-size:13px;font-weight:800'}, title), h('div',{style:'font-size:12px;color:#D0D0D0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'}, sub)),
    h('div',{style:'font-size:11px;color:#BDBDBD'},'now'));
  $app.appendChild(t);
  setTimeout(()=>{ t.classList.add('hide'); setTimeout(()=>t.remove(),400); }, 3600);
  updateBell();
}
function updateBell(){
  document.querySelectorAll('[data-bell]').forEach(b=>{
    const n = unread(); let d = b.querySelector('.dot-badge');
    if (!n){ if (d) d.remove(); return; }
    if (!d){ d = h('span',{class:'dot-badge'}); b.appendChild(d); }
    d.textContent = n>9 ? '9+' : String(n);
    b.setAttribute('aria-label','Notifications ('+n+' new)');
  });
}

function modeOf(id){ return (S.chatModes && S.chatModes[id]) || S.defaultMode || 'keep'; }
function hiddenFrom(id){ return !!(S.vanish && (S.vanish.all || S.vanish.hideFrom.includes(id))); }
function closeChat(id){
  const mode = modeOf(id); let msgs = S.chats[id] || [];
  if (mode==='after') msgs = [];
  else if (mode==='once') msgs = msgs.map(m => (!m.gone && m.once && ((m.from==='me' && m.read) || (m.from!=='me' && m.opened))) ? {from:m.from, gone:true, ts:m.ts} : m);
  S.chats[id] = msgs; save();
}

/* ---------- media utils ---------- */
function fileToDataURL(file){
  return new Promise((res, rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(new Error('That file could not be read. Try another photo.')); fr.readAsDataURL(file); });
}
async function readImage(file, max){
  if (file.type === 'image/gif'){
    if (file.size > 2.5*1024*1024) throw new Error('GIF is larger than 2.5 MB');
    return fileToDataURL(file);
  }
  const data = await fileToDataURL(file);
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, (max||900)/Math.max(img.naturalWidth||img.width, img.naturalHeight||img.height));
        const c=document.createElement('canvas'); c.width=Math.max(1,Math.round((img.naturalWidth||img.width)*k)); c.height=Math.max(1,Math.round((img.naturalHeight||img.height)*k));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82));
      } catch(e){ res(data); }
    };
    img.onerror = () => rej(new Error('This photo format isn’t supported here. Use a JPG or PNG (on iPhone: Settings › Camera › Formats › Most Compatible).'));
    img.src = data;
  });
}
async function readVideo(file){
  if (!file.type.startsWith('video/')) throw new Error('Choose a short video');
  if (file.size <= 25*1024*1024) { try { return await fileToDataURL(file); } catch(e){} }
  try { return URL.createObjectURL(file); } catch(e){ return null; }
}
function pickFile(accept, capture, cb){
  document.querySelectorAll('input.hidden-input').forEach(x=>x.remove());
  const inp = h('input',{type:'file', accept, class:'hidden-input', tabindex:'-1', 'aria-hidden':'true'});
  if (capture) inp.setAttribute('capture', capture);
  inp.addEventListener('change', ()=>{ const f = inp.files && inp.files[0]; inp.remove(); if (f) cb(f); });
  document.body.appendChild(inp); inp.click();
}

function fling(card, dir, done){

  setTimeout(done, 300);
}
function attachSwipe(card, cb){

/* ---------- real location ---------- */
function getLocation(ok, fail){
  if (!navigator.geolocation){ fail('Location isn’t available on this device.'); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat = +pos.coords.latitude.toFixed(3), lng = +pos.coords.longitude.toFixed(3);
    let city = '', country = '';
    try {
      const r = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lng+'&localityLanguage=en');
      if (r.ok){ const j = await r.json(); city = j.city || j.locality || j.principalSubdivision || ''; country = j.countryName || ''; }
    } catch(e){}
    ok({lat, lng, city: city ? city + (country ? ', '+country : '') : 'Near '+lat+', '+lng, ts: now()});
  }, err=>{
    fail(err && err.code===1 ? 'Location is blocked. Allow location for this site in your browser settings, then try again.' : 'Couldn’t get your location. Check that location is turned on and try again.');
  }, {enableHighAccuracy:false, timeout:12000, maximumAge:600000});
}

    h('div',{style:'font-size:12px;line-height:1.45;padding:10px 12px;border-radius:14px;background:#FFF4E5;color:#7A4B00;margin-bottom:12px'}, 'This panel shows what’s stored on this phone. To see every real user across all phones, Tingram needs its backend with a secure admin login on the server — a PIN in the app is not real security.'),
    h('div',{class:'row', style:'gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none'}, Object.keys(tabs).map(t=>h('button',{class:'chip'+(tab===t?' on':''), style:'flex-shrink:0', onclick:()=>{ V.adminTab=t; render(); }}, t))),
    tabs[tab]()));
}
/* ---------- render ---------- */
function render(){
  setTimeout(hydrateMedia, 0);
  setTimeout(()=>{ if (V.showTerms) $app.appendChild(TermsView()); if (V.admin==='pin') $app.appendChild(AdminPin()); else if (V.admin==='panel') $app.appendChild(AdminPanel()); }, 0);
  const light = S.theme !== 'dark'; document.body.classList.toggle('light', light); document.documentElement.classList.toggle('light-html', light);
  renderInner();
  const slots = $app.querySelectorAll('[data-avatar3d]'); const slot = slots[slots.length-1];
  if (V.overlay==='motion'){ A3.stop(); motAttach(); }
  else { motStop(); if (slot) A3.attach(slot, (S.avatar && S.avatar.look) || defLook()); else A3.stop(); }
}
function renderInner(){
  const keepScroll = $app.querySelector('.scroll'); const st = keepScroll ? keepScroll.scrollTop : 0; const sameTab = render._tab === V.tab+'|'+V.overlay;
  $app.textContent = '';
  if (!S.me){ $app.appendChild(V.overlay==='signup' ? Signup() : Welcome()); return; }
  if (!S.avatar.created || V.editAvatar){ $app.appendChild(AvatarCreate()); return; }
  if (V.studio){ $app.appendChild(Studio()); return; }
  const main = {discover:Discover, moments:Moments, plans:CalendarTab, chats:Chats, me:Me}[V.tab]();
  $app.appendChild(main); $app.appendChild(nav());
  if (V.tab==='plans' && !V.overlay){ const sh = CalSheet(); if (sh) $app.appendChild(sh); }
  if (sameTab){ const sc=$app.querySelector('.scroll'); if(sc) sc.scrollTop = st; }
  render._tab = V.tab+'|'+V.overlay;
  const ov = {chat:Chat, match:Match, notes:Notes, flash:FlashView, viewer:Viewer, buddy:Buddy, mall:Mall, motion:Motion, memview:MemView}[V.overlay];
  if (ov) $app.appendChild(ov());
}
render();

/* gentle demo activity: someone shares a plan, a stranger messages your avatar */
setTimeout(()=>{ if (S.avatar.created && !owns('Roses') && !S.giftedRoses){ S.giftedRoses=true; S.owned.push('Roses'); save(); notify('Mai’s avatar sent you a gift', 'Rose bouquet — wear it from the studio', 'gift', {tab:'me'}); } }, 40000);
setTimeout(()=>{ if (S.avatar.created) notify('Sarah shared a plan', 'Live music · 21:00–00:00 tonight', 'clock', {tab:'plans'}); }, 9000);
setTimeout(()=>{ if (S.avatar.created && S.settings.strangers==='avatar') notify('Kai is chatting with your avatar', 'Let him talk to you from the Me tab', 'spark', {tab:'me'}); }, 22000);
})();
</script>
