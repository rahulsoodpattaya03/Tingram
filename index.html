<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tingram - Pet Matchmaking</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f9; padding: 20px; max-width: 400px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { background: #ff4757; color: white; border: none; font-weight: bold; cursor: pointer; }
    .pet-item { border-bottom: 1px solid #eee; padding: 10px 0; }
    .listen-btn { background: #2ed573; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🐶 Tingram Pets</h2>
    <input type="text" id="petName" placeholder="Pet Name (e.g., Max)">
    <input type="text" id="petBreed" placeholder="Breed (e.g., Golden Retriever)">
    <select id="petSpecies">
      <option value="Dog">Dog</option>
      <option value="Cat">Cat</option>
    </select>
    <button id="addPetBtn">Add Pet</button>
  </div>

  <div class="card">
    <h3>Matches</h3>
    <div id="petsList">Loading...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

    // ⚠️ ONLY PASTE INSIDE THE QUOTES. DO NOT DELETE ANY BRACKETS OR COMMAS.
    const firebaseConfig = {
      apiKey: "AIzaSyCZRdqEhTdTRxM4h6KJS3a6014bhkhUI8A",
      authDomain: "tingram-test-b3213.firebaseapp.com",
      projectId: "tingram-test-b3213",
      storageBucket: "tingram-test-b3213.firebasestorage.app",
      messagingSenderId: "166205588183",
      appId: "PASTE_YOUR_APP_ID_HERE",
      measurementId: "G-32WF9L8973"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    signInAnonymously(auth).then(() => {
      loadPets();
    }).catch((error) => console.error("Auth error:", error));

    const addBtn = document.getElementById("addPetBtn");
    const list = document.getElementById("petsList");
    const nameInput = document.getElementById("petName");
    const breedInput = document.getElementById("petBreed");
    const speciesInput = document.getElementById("petSpecies");

    // Initialize Web Speech API for listening
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
    }

    addBtn.addEventListener("click", async () => {
      if (!nameInput.value || !breedInput.value) return alert("Fill all fields!");
      addBtn.textContent = "Adding...";
      
      await addDoc(collection(db, "pets"), {
        name: nameInput.value,
        breed: breedInput.value,
        species: speciesInput.value,
        timestamp: new Date()
      });

      nameInput.value = "";
      breedInput.value = "";
      addBtn.textContent = "Add Pet";
      loadPets();
    });

    // Handle microphone button clicks
    list.addEventListener("click", (e) => {
      if (e.target.classList.contains("listen-btn")) {
        const petName = e.target.dataset.name;
        
        if (!recognition) {
          alert("Microphone not supported on this browser.");
          return;
        }
        
        e.target.textContent = "🎙️ Listening to you...";
        e.target.style.background = "#ff4757";

        recognition.start();

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          alert(`You said to ${petName}: "${transcript}"\n\n(Next, ElevenLabs will process this and speak back!)`);
          e.target.textContent = `🎤 Speak to ${petName}`;
          e.target.style.background = "#2ed573";
        };

        recognition.onerror = (event) => {
          alert("Microphone error. Try again.");
          e.target.textContent = `🎤 Speak to ${petName}`;
          e.target.style.background = "#2ed573";
        };
      }
    });

    async function loadPets() {
      const querySnapshot = await getDocs(collection(db, "pets"));
      list.innerHTML = "";
      querySnapshot.forEach((doc) => {
        const pet = doc.data();
        const icon = pet.species === "Cat" ? "🐱" : "🐶";
        
        // Added the new Speak button without removing any existing data display
        list.innerHTML += `
          <div class="pet-item">
            ${icon} <strong>${pet.name}</strong> - ${pet.breed} (${pet.species})
            <button class="listen-btn" data-name="${pet.name}" data-species="${pet.species}">🎤 Speak to ${pet.name}</button>
          </div>
        `;
      });
      if(list.innerHTML === "") list.innerHTML = "No pets added yet.";
    }
  </script>
</body>
</html>
