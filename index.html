<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tingram Atelier — Luxury Collection</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth transitions for zoom and swap */
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        /* Custom scrollbar for clothing rail */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#F4F4F4] text-neutral-900 font-sans select-none overflow-hidden h-screen flex flex-col justify-between">

    <!-- Top Brand Bar -->
    <header class="flex justify-between items-center px-8 py-6 border-b border-neutral-300 z-20 bg-[#F4F4F4]/90 backdrop-blur-md">
        <h1 class="text-sm tracking-[0.2em] uppercase font-semibold">TINGRAM ATELIER</h1>
        <span class="text-xs text-neutral-500 tracking-widest">COLLECTION 2026</span>
    </header>

    <!-- Main Dynamic Stage -->
    <main id="app-stage" class="flex-1 flex items-center justify-center relative w-full overflow-hidden">
        
        <!-- VIEW 1: THE CLOSET RAIL (Default) -->
        <div id="rail-view" class="relative w-full h-full flex flex-col justify-center items-center fade-in">
            <!-- Metal Rod Graphic -->
            <div class="absolute top-[32%] w-[85%] max-w-5xl h-[3px] bg-neutral-300 shadow-inner rounded-full"></div>

            <!-- Hanging Items Container -->
            <div class="flex gap-16 z-10 overflow-x-auto px-12 items-start pt-16 max-w-full no-scrollbar">
                
                <!-- Item 1 -->
                <div onclick="openItem(1)" class="cursor-pointer flex flex-col items-center group flex-shrink-0 transition-transform duration-300 hover:-translate-y-2">
                    <div class="w-36 h-72 flex items-center justify-center">
                        <!-- Replace with your transparent PNG links or asset paths -->
                        <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?q=80&w=600&auto=format&fit=crop" alt="Tank Top" class="max-h-full max-w-full object-contain drop-shadow-2xl pointer-events-none group-hover:scale-105 transition-transform">
                    </div>
                    <span class="mt-6 text-[10px] tracking-[0.25em] text-neutral-500 group-hover:text-black uppercase transition-colors">DISTRESSED TANK TOP</span>
                </div>

                <!-- Item 2 -->
                <div onclick="openItem(2)" class="cursor-pointer flex flex-col items-center group flex-shrink-0 transition-transform duration-300 hover:-translate-y-2">
                    <div class="w-36 h-72 flex items-center justify-center">
                        <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?q=80&w=600&auto=format&fit=crop" alt="Cashmere Hoodie" class="max-h-full max-w-full object-contain drop-shadow-2xl pointer-events-none group-hover:scale-105 transition-transform">
                    </div>
                    <span class="mt-6 text-[10px] tracking-[0.25em] text-neutral-500 group-hover:text-black uppercase transition-colors">CASHMERE HOODIE</span>
                </div>

                <!-- Item 3 -->
                <div onclick="openItem(3)" class="cursor-pointer flex flex-col items-center group flex-shrink-0 transition-transform duration-300 hover:-translate-y-2">
                    <div class="w-36 h-72 flex items-center justify-center">
                        <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?q=80&w=600&auto=format&fit=crop" alt="Leather Bomber" class="max-h-full max-w-full object-contain drop-shadow-2xl pointer-events-none group-hover:scale-105 transition-transform">
                    </div>
                    <span class="mt-6 text-[10px] tracking-[0.25em] text-neutral-500 group-hover:text-black uppercase transition-colors">LEATHER BOMBER</span>
                </div>

            </div>
        </div>

        <!-- VIEW 2: ZOOMED ITEM VIEW (Hidden by default) -->
        <div id="detail-view" class="hidden w-full h-full flex flex-col items-center justify-center relative px-6 fade-in">
            <!-- Back to Rail Button -->
            <button onclick="closeItem()" class="absolute top-8 left-10 text-[11px] tracking-[0.2em] uppercase underline text-neutral-500 hover:text-black transition-colors">
                ← Back to Rail
            </button>

            <!-- Garment Display Area -->
            <div class="h-[42vh] flex items-center justify-center relative mt-4">
                <img id="detail-img" src="" alt="Selected Garment" class="max-h-full object-contain drop-shadow-2xl transition-all duration-300">
            </div>

            <!-- Front / Back Toggle Selector -->
            <div class="flex gap-3 mt-8 bg-neutral-200/80 p-1.5 rounded-full text-xs shadow-inner">
                <button id="btn-front" onclick="switchSide('front')" class="px-5 py-2 rounded-full transition-all tracking-wider bg-black text-white shadow-md">FRONT</button>
                <button id="btn-back" onclick="switchSide('back')" class="px-5 py-2 rounded-full transition-all tracking-wider text-neutral-600 hover:text-black">BACK</button>
            </div>

            <!-- Product Title & Affiliate Action -->
            <h2 id="detail-title" class="mt-5 text-sm font-medium tracking-[0.15em] text-center">PRODUCT TITLE</h2>
            
            <a id="detail-link" href="#" target="_blank" rel="noopener noreferrer" class="mt-5 bg-black text-white px-10 py-3.5 text-xs tracking-[0.25em] uppercase hover:bg-neutral-800 transition-all shadow-lg hover:scale-105 active:scale-95">
                See Availability — $450
            </a>
        </div>

    </main>

    <!-- Marquee Ticker Footer -->
    <footer class="w-full bg-black text-white py-3 overflow-hidden whitespace-nowrap text-[11px] tracking-[0.3em] z-20">
        <div class="inline-block uppercase">
            ✦ TINGRAM 2026 ✦ EXCLUSIVE LUXURY PARTNERSHIPS ✦ WORLDWIDE CURATED DROPS ✦ IT'S US, NEVER THEM ✦ 
        </div>
    </footer>

    <!-- Interactive JavaScript Logic -->
    <script>
        // Catalog Database (Easily add your items & affiliate tracking links here)
        const catalog = {
            1: {
                name: "DISTRESSED PAINTED LOGO TANK TOP",
                front: "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?q=80&w=600&auto=format&fit=crop",
                back: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=600&auto=format&fit=crop",
                price: "$450",
                url: "https://www.farfetch.com" // Your affiliate link
            },
            2: {
                name: "OVERSIZED RAW EDGE CASHMERE HOODIE",
                front: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?q=80&w=600&auto=format&fit=crop",
                back: "https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=600&auto=format&fit=crop",
                price: "$1,250",
                url: "https://www.ssense.com"
            },
            3: {
                name: "VINTAGE WASHED LEATHER BOMBER",
                front: "https://images.unsplash.com/photo-1551028719-00167b16eac5?q=80&w=600&auto=format&fit=crop",
                back: "https://images.unsplash.com/photo-1548883354-7622d03aca27?q=80&w=600&auto=format&fit=crop",
                price: "$2,800",
                url: "https://www.net-a-porter.com"
            }
        };

        let currentId = null;
        let currentSide = 'front';

        function openItem(id) {
            currentId = id;
            currentSide = 'front';
            const item = catalog[id];

            document.getElementById('detail-img').src = item.front;
            document.getElementById('detail-title').innerText = item.name;
            document.getElementById('detail-link').href = item.url;
            document.getElementById('detail-link').innerText = `See Availability — ${item.price}`;

            // Switch views
            document.getElementById('rail-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
            updateToggleUI();
        }

        function closeItem() {
            currentId = null;
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('rail-view').classList.remove('hidden');
        }

        function switchSide(side) {
            if (!currentId) return;
            currentSide = side;
            const item = catalog[currentId];
            
            const imgElement = document.getElementById('detail-img');
            imgElement.classList.add('opacity-0', 'translate-y-2');
            
            setTimeout(() => {
                imgElement.src = side === 'front' ? item.front : item.back;
                imgElement.classList.remove('opacity-0', 'translate-y-2');
            }, 150);

            updateToggleUI();
        }

        function updateToggleUI() {
            const btnFront = document.getElementById('btn-front');
            const btnBack = document.getElementById('btn-back');

            if (currentSide === 'front') {
                btnFront.className = "px-5 py-2 rounded-full transition-all tracking-wider bg-black text-white shadow-md";
                btnBack.className = "px-5 py-2 rounded-full transition-all tracking-wider text-neutral-600 hover:text-black";
            } else {
                btnBack.className = "px-5 py-2 rounded-full transition-all tracking-wider bg-black text-white shadow-md";
                btnFront.className = "px-5 py-2 rounded-full transition-all tracking-wider text-neutral-600 hover:text-black";
            }
        }
    </script>
</body>
</html>
